<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>رفيقة الآية</title>
<link href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@700&family=Cairo:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f1f5f3;--surface:#fff;--ink:#16221e;--muted:#5f716b;--line:#d6e0dc;--green:#0f5c4a;--green-soft:#dcece6;--gold:#b8893a;--on-green:#fff;--err:#b3382c}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#0f1815;--surface:#17231f;--ink:#e8f0ec;--muted:#93a69f;--line:#2a3b35;--green:#4fb39a;--green-soft:#1f3a32;--gold:#d4a85a;--on-green:#0b1512;--err:#ff8a7a}}
*{box-sizing:border-box}
html{color-scheme:light dark}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.7 Cairo,Tahoma,sans-serif;padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
main{max-width:560px;margin:0 auto;padding:20px 16px 40px}
h1{font:700 34px/1.3 "Aref Ruqaa","Traditional Arabic",serif;color:var(--green);margin:8px 0 2px}
.sub{color:var(--muted);margin:0 0 20px;font-size:14px}
section{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:16px}
h2{font-size:17px;font-weight:600;margin:0 0 12px}
section.companion{border-color:var(--gold);border-width:1.5px}
label{display:block;font-weight:600;margin:12px 0 4px;font-size:15px}
input[type=text],textarea{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
textarea{min-height:76px;resize:vertical}
input:focus-visible,textarea:focus-visible,button:focus-visible,.chk:focus-within{outline:2px solid var(--green);outline-offset:2px}
.chk{display:flex;gap:10px;align-items:flex-start;padding:10px 4px;cursor:pointer;border-bottom:1px solid var(--line);font-weight:400}
.chk:last-of-type{border-bottom:0}
.chk input{width:22px;height:22px;accent-color:var(--green);flex:none;margin-top:3px}
.confirm{background:var(--green-soft);border-radius:10px;padding:10px 12px;margin-top:14px;border:0}
button{width:100%;font:700 17px Cairo,Tahoma,sans-serif;border-radius:10px;padding:13px 16px;border:1px solid var(--green);background:var(--green);color:var(--on-green);cursor:pointer}
button:disabled{opacity:.6;cursor:default}
.msg{min-height:24px;margin:10px 0 0;font-size:14px;color:var(--green)}
.msg.err{color:var(--err)}
#preview{display:block;width:100%;max-width:360px;margin:12px auto 0;border-radius:12px;border:1px solid var(--line)}
</style>
</head>
<body>
<main>
  <h1>رفيقة الآية</h1>
  <p class="sub">تعبئها الطالبة، ثم تراجعها الرفيقة وتؤكد الإنجاز، ثم تُرسل صورة البطاقة.</p>

  <section>
    <h2>إنجاز الطالبة</h2>
    <label for="student">اسم الطالبة</label>
    <input type="text" id="student" placeholder="اكتبي اسم الطالبة">
    <label for="buddy">اسم الرفيقة</label>
    <input type="text" id="buddy" placeholder="اسم رفيقة المراجعة">
    <label for="review">إنجاز المراجعة</label>
    <textarea id="review" placeholder="السور أو الأجزاء التي تمت مراجعتها"></textarea>
    <label for="improve">مواضع تحتاج إلى تحسين</label>
    <textarea id="improve" placeholder="أخطاء، تردد، متشابهات..."></textarea>
  </section>

  <section class="companion">
    <h2>مراجعة الرفيقة</h2>
    <label class="chk"><input type="checkbox" class="step"><span>سمّعت المقدار المحدد كاملًا</span></label>
    <label class="chk"><input type="checkbox" class="step"><span>ضبطت الكلمات والحركات</span></label>
    <label class="chk"><input type="checkbox" class="step"><span>حددت مواضع التردد</span></label>
    <label class="chk"><input type="checkbox" class="step"><span>راجعت المتشابهات</span></label>
    <label class="chk"><input type="checkbox" class="step"><span>أعدت الأخطاء التي وقعت فيها</span></label>
    <label class="chk confirm"><input type="checkbox" id="ok"><span>أؤكد أنا الرفيقة أني استمعت للمراجعة وتحققت من الإنجاز المسجل.</span></label>
  </section>

  <button id="send">إرسال</button>
  <p class="msg" id="msg" role="status"></p>
  <img id="preview" alt="صورة البطاقة" hidden>
</main>

<script>
const $ = id => document.getElementById(id);
const steps = [...document.querySelectorAll(".step")];

function say(t, isErr) {
  $("msg").textContent = t;
  $("msg").classList.toggle("err", !!isErr);
}

// تحميل الخطوط مسبقًا ليكون الرسم فوريًا عند الضغط
const fontsReady = Promise.all([
  document.fonts.load('700 100px "Aref Ruqaa"', "رفيقة الآية"),
  document.fonts.load('700 34px Cairo', "الحفظ الجديد"),
  document.fonts.load('600 26px Cairo', "المراجعة")
]).catch(() => {});

const C = {bg:"#1f1d4f", cream:"#fdf4e1", gold:"#f2c14e", coral:"#f27c68", teal:"#3cbfae", lav:"#b49cf5", ink:"#1f1d4f", muted:"#6a6890"};
const BADGES = [C.coral, C.gold, C.teal, C.lav];
const W = 1080, PAD = 90, RW = W - PAD * 2;
const TITLE_FONT = '"Aref Ruqaa","Traditional Arabic",serif';
const BODY_FONT = 'Cairo,Tahoma,sans-serif';

function wrap(ctx, text, maxW) {
  const out = [];
  text.split("\n").forEach(par => {
    let line = "";
    par.split(/\s+/).filter(Boolean).forEach(w => {
      const t = line ? line + " " + w : w;
      if (ctx.measureText(t).width > maxW && line) { out.push(line); line = w; } else line = t;
    });
    out.push(line);
  });
  return out.length ? out : [""];
}
function poly(ctx, x, y, pts, r, inner, color) {
  ctx.fillStyle = color; ctx.beginPath();
  for (let i = 0; i < pts * 2; i++) {
    const a = Math.PI / pts * i - Math.PI / 2, rad = i % 2 === 0 ? r : r * inner;
    ctx.lineTo(x + Math.cos(a) * rad, y + Math.sin(a) * rad);
  }
  ctx.closePath(); ctx.fill();
}
const sparkle = (ctx, x, y, r, c) => poly(ctx, x, y, 4, r, 0.28, c);
const star5 = (ctx, x, y, r, c) => poly(ctx, x, y, 5, r, 0.45, c);
function pill(ctx, x, y, w, h, r, color) {
  ctx.fillStyle = color; ctx.beginPath();
  ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); ctx.fill();
}
function hijriDate() {
  try {
    return new Date().toLocaleDateString("ar-SA-u-ca-islamic-umalqura", {weekday:"long", day:"numeric", month:"long", year:"numeric"});
  } catch (e) {
    return new Date().toLocaleDateString("ar-SA");
  }
}

function check(ctx, cx, cy, color, k) {
  k = k || 1;
  ctx.strokeStyle = color; ctx.lineWidth = 7 * k; ctx.lineCap = "round"; ctx.lineJoin = "round";
  ctx.beginPath(); ctx.moveTo(cx - 13 * k, cy + k); ctx.lineTo(cx - 3 * k, cy + 11 * k); ctx.lineTo(cx + 14 * k, cy - 10 * k); ctx.stroke();
}

function drawPoster(rec) {
  const canvas = document.createElement("canvas");
  canvas.width = W; canvas.height = 2600;
  let ctx = canvas.getContext("2d");
  ctx.direction = "rtl";

  const GAP = 24, CW = (RW - GAP) / 2, IN = 26, R = PAD + RW;
  const colX = [R - CW, PAD]; // العمود الأيمن ثم الأيسر

  // قياس: العمود الأيمن (المراجعة ومواضع التحسين)
  const secs = [{label: "المراجعة", text: rec.review || "—"}];
  if (rec.improve) secs.push({label: "مواضع تحتاج إلى تحسين", text: rec.improve});
  ctx.font = "600 32px " + BODY_FONT;
  secs.forEach(s => { s.lines = wrap(ctx, s.text, CW - IN * 2); });
  const rightH = 24 + secs.reduce((a, s) => a + 44 + 46 * s.lines.length, 0) + (secs.length - 1) * 30 + 24;

  // قياس: العمود الأيسر (قائمة ✔️)
  ctx.font = "600 28px " + BODY_FONT;
  const items = rec.steps.map(s => ({done: s.done, lines: wrap(ctx, s.label, CW - IN * 2 - 34 - 16)}));
  const leftH = 24 + 48 + items.reduce((a, it) => a + it.lines.length * 38 + 20, 0) + (items.length - 1) * 6 + 24;
  const rowH = Math.max(rightH, leftH);

  const namesTop = 330, namesH = 120;
  const rowTop = namesTop + namesH + GAP;
  const footTop = rowTop + rowH + GAP, footH = 96;
  const H = Math.max(1400, footTop + footH + 110);

  canvas.height = H;
  ctx = canvas.getContext("2d");
  ctx.direction = "rtl"; ctx.textBaseline = "alphabetic";

  // الخلفية والنجوم
  ctx.fillStyle = C.bg; ctx.fillRect(0, 0, W, H);
  sparkle(ctx, 300, 70, 14, "#fff"); sparkle(ctx, W - 110, 100, 34, C.coral);
  sparkle(ctx, 130, 170, 20, C.teal); sparkle(ctx, 110, H - 48, 34, C.lav);
  sparkle(ctx, W - 90, H - 60, 20, C.gold); sparkle(ctx, W - 300, H - 35, 12, "#fff");

  // رأس الجريدة: العنوان وخطوط مزدوجة والتاريخ
  const t1 = "رفيقة", t2 = "الآية", sp = 26;
  let ms = 124;
  ctx.font = "700 " + ms + "px " + TITLE_FONT;
  while (ctx.measureText(t1).width + sp + ctx.measureText(t2).width > RW && ms > 60) { ms -= 4; ctx.font = "700 " + ms + "px " + TITLE_FONT; }
  const w1 = ctx.measureText(t1).width, w2 = ctx.measureText(t2).width;
  const xr = (W + w1 + sp + w2) / 2;
  ctx.textAlign = "right";
  ctx.fillStyle = C.gold; ctx.fillText(t1, xr, 190);
  ctx.fillStyle = C.cream; ctx.fillText(t2, xr - w1 - sp, 190);
  ctx.fillStyle = C.gold; ctx.fillRect(PAD, 228, RW, 5); ctx.fillRect(PAD, 242, RW, 2);
  ctx.textAlign = "center"; ctx.fillStyle = "#cfcbe8"; ctx.font = "600 28px " + BODY_FONT;
  ctx.fillText(hijriDate(), W / 2, 292);

  // أسماء الرفيقات بدون تمييز
  const names = [rec.student, rec.buddy].filter(Boolean).join(" و ");
  pill(ctx, PAD, namesTop, RW, namesH, 22, C.cream);
  ctx.textAlign = "right";
  star5(ctx, R - IN - 12, namesTop + 34, 12, C.coral);
  ctx.fillStyle = C.muted; ctx.font = "600 26px " + BODY_FONT;
  ctx.fillText("رفيقات السرد", R - IN - 34, namesTop + 44);
  let fs = 46;
  ctx.font = "700 " + fs + "px " + BODY_FONT;
  while (ctx.measureText(names).width > RW - IN * 2 && fs > 22) { fs -= 2; ctx.font = "700 " + fs + "px " + BODY_FONT; }
  ctx.fillStyle = C.ink; ctx.fillText(names, R - IN, namesTop + 96);

  // العمود الأيمن: المراجعة ومواضع التحسين
  pill(ctx, colX[0], rowTop, CW, rowH, 22, C.cream);
  let y = rowTop + 24;
  secs.forEach((s, i) => {
    ctx.textAlign = "right";
    star5(ctx, R - IN - 12, y + 18, 12, BADGES[(i + 2) % 4]);
    ctx.fillStyle = C.muted; ctx.font = "600 26px " + BODY_FONT;
    ctx.fillText(s.label, R - IN - 34, y + 28);
    ctx.fillStyle = C.ink; ctx.font = "600 32px " + BODY_FONT;
    s.lines.forEach((ln, k) => ctx.fillText(ln, R - IN, y + 76 + 46 * k));
    y += 44 + 46 * s.lines.length;
    if (i < secs.length - 1) { ctx.fillStyle = "#e0d6bb"; ctx.fillRect(colX[0] + IN, y + 12, CW - IN * 2, 2); y += 30; }
  });

  // العمود الأيسر: مستطيل ✔️ لوحده
  const lx = colX[1], lr = lx + CW;
  pill(ctx, lx, rowTop, CW, rowH, 22, C.cream);
  ctx.textAlign = "right";
  star5(ctx, lr - IN - 12, rowTop + 42, 12, C.teal);
  ctx.fillStyle = C.muted; ctx.font = "600 26px " + BODY_FONT;
  ctx.fillText("مراجعة الرفيقة", lr - IN - 34, rowTop + 52);
  let iy = rowTop + 72;
  ctx.font = "600 28px " + BODY_FONT;
  items.forEach(it => {
    const bx = lr - IN - 34, by = iy + 4;
    pill(ctx, bx, by, 34, 34, 9, it.done ? C.teal : "#e6dfc9");
    if (it.done) check(ctx, bx + 17, by + 17, C.ink, 0.6);
    ctx.fillStyle = it.done ? C.ink : "#8e8cab";
    it.lines.forEach((ln, k) => ctx.fillText(ln, lr - IN - 34 - 16, iy + 30 + 38 * k));
    iy += it.lines.length * 38 + 20 + 6;
  });

  // شريط التأكيد
  const ok = rec.confirmed;
  pill(ctx, PAD, footTop, RW, footH, footH / 2, ok ? C.teal : "rgba(253,244,225,.12)");
  ctx.textAlign = "center"; ctx.fillStyle = ok ? C.ink : "#cfcbe8"; ctx.font = "700 30px " + BODY_FONT;
  const msg = ok ? "أكّدت الرفيقة أنها استمعت للمراجعة وتحققت من الإنجاز" : "لم تؤكد الرفيقة المراجعة بعد";
  const mw = ctx.measureText(msg).width;
  ctx.fillText(msg, W / 2 - (ok ? 24 : 0), footTop + footH / 2 + 11);
  if (ok) check(ctx, W / 2 - 24 + mw / 2 + 40, footTop + footH / 2, C.ink, 0.9);
  return canvas;
}

$("send").onclick = async () => {
  const rec = {
    student: $("student").value.trim(),
    buddy: $("buddy").value.trim(),
    review: $("review").value.trim(),
    improve: $("improve").value.trim(),
    steps: steps.map(s => ({label: s.nextElementSibling.textContent.trim(), done: s.checked})),
    confirmed: $("ok").checked
  };
  if (!rec.student) { say("اكتبي اسم الطالبة أولًا.", true); $("student").focus(); return; }

  $("send").disabled = true;
  say("جارٍ تجهيز الصورة...");
  try {
    await fontsReady;
    const canvas = drawPoster(rec);
    const blob = await new Promise(res => canvas.toBlob(res, "image/png"));
    if (!blob) throw new Error("no blob");
    $("preview").src = URL.createObjectURL(blob);
    $("preview").hidden = false;
    const file = new File([blob], "sard-card.png", {type: "image/png"});
    if (navigator.canShare && navigator.canShare({files: [file]})) {
      try {
        await navigator.share({files: [file], title: "رفيقة الآية"});
        say("تم تجهيز الصورة للإرسال.");
      } catch (e) {
        if (e && e.name === "AbortError") say("تم إلغاء الإرسال. الصورة جاهزة أدناه.");
        else throw e;
      }
    } else {
      const a = document.createElement("a");
      a.href = $("preview").src; a.download = "sard-card.png"; a.click();
      say("تم تنزيل الصورة. أرسليها من معرض الصور.");
    }
  } catch (e) {
    say("تعذّر تجهيز الصورة. حاولي مرة ثانية.", true);
  }
  $("send").disabled = false;
};

</script>
</body>
</html>
